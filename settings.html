<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Ticketing System</title>
    <link rel="icon" href="data:,">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]'],
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="notifications.css">
    <style>
        :root {
            --primary-color: #5b5ce2;
            --primary-hover: #4b4dd7;
            --secondary-color: #64748b;
            --bg-color: #f3f5ff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(15, 23, 42, 0.12);
        }

        [data-theme="dark"] {
            --primary-color: #8b8cf7;
            --primary-hover: #7c7df2;
            --secondary-color: #94a3b8;
            --bg-color: #0b1020;
            --card-bg: #0f172a;
            --text-main: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.18);
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(15, 23, 42, 0.45);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: auto;
            padding: 2rem;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 500px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
            position: relative;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="relative w-80 bg-slate-900 text-white flex flex-col transition-all duration-300 z-20 shrink-0">
    <button 
      id="toggle-btn"
      class="absolute -right-4 top-10 flex h-8 w-8 items-center justify-center rounded-full bg-indigo-600 text-white shadow-md transition-transform hover:bg-indigo-700 focus:outline-none"
    >
      <svg 
        id="chevron"
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="3" 
        stroke="currentColor" 
        class="h-4 w-4 transition-transform duration-300"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
    <div class="p-8 text-2xl font-bold border-b border-slate-700 flex items-center gap-3 whitespace-nowrap overflow-hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-blue-400 shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
      </svg>
        <span class="sidebar-text transition-opacity duration-300">Ticketing System</span>
    </div>

    <nav class="flex-1 p-6 space-y-4 overflow-y-auto">
      <a href="admin.html" class="flex items-center gap-3 px-6 py-4 hover:bg-slate-800 rounded-2xl text-lg transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-blue-400 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        <span class="sidebar-text whitespace-nowrap">Dashboard</span>
      </a>
      <a href="tickets.html" class="flex items-center gap-3 px-6 py-4 hover:bg-slate-800 rounded-2xl text-lg transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-blue-400 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
        </svg>
        <span class="sidebar-text whitespace-nowrap">All Tickets</span>
      </a>
      <a href="settings.html" class="flex items-center gap-3 px-6 py-4 bg-slate-800 rounded-2xl text-lg group hover:bg-slate-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-blue-400 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.99l1.005.828c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <span class="sidebar-text whitespace-nowrap">Settings</span>
      </a>
      <button id="logoutBtn" class="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-800 rounded-2xl text-lg transition-colors text-left">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-blue-400 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
        </svg>
        <span class="sidebar-text whitespace-nowrap">Logout</span>
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-10 bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

    <!-- Top Bar -->
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-4xl font-semibold dark:text-white">Settings</h1>
      <div class="flex items-center gap-5">
        <span class="text-xl text-gray-600 font-semibold dark:text-gray-300">Welcome, Admin</span>
        <button id="themeToggleBtn" class="p-3 rounded-xl bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 shadow-sm transition-colors">
          <i class="fas fa-moon block dark:hidden w-6 h-6 text-xl"></i>
          <i class="fas fa-sun hidden dark:block w-6 h-6 text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Settings Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">

      <!-- Categories Section -->
      <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm transition-colors flex flex-col h-[500px]">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-semibold dark:text-white">Manage Categories</h3>
          <button id="addCategoryBtn" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 text-sm font-medium transition-colors">
            <i class="fas fa-plus mr-1"></i> Add
          </button>
        </div>
        <div class="flex-1 overflow-y-auto pr-2">
            <ul id="categoriesList" class="space-y-3">
              <!-- Dynamically populated -->
            </ul>
        </div>
      </div>

      <!-- Ticket Types Section -->
      <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm transition-colors flex flex-col h-[500px]">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-semibold dark:text-white">Manage Ticket Types</h3>
          <button id="addTicketTypeBtn" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 text-sm font-medium transition-colors">
            <i class="fas fa-plus mr-1"></i> Add
          </button>
        </div>
        <div class="flex-1 overflow-y-auto pr-2">
            <ul id="ticketTypesList" class="space-y-3">
              <!-- Dynamically populated -->
            </ul>
        </div>
      </div>

    </div>

  </main>
</div>

<!-- Add/Edit Modal -->
<div id="itemModal" class="modal">
    <div class="modal-content">
        <div class="flex justify-between items-center mb-6">
            <h3 id="modalTitle" class="text-2xl font-bold dark:text-white">Add Item</h3>
            <button class="close-modal text-gray-500 hover:text-gray-800 dark:hover:text-gray-200">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        
        <form id="itemForm" class="space-y-5">
            <input type="hidden" id="itemType" name="itemType">
            <input type="hidden" id="itemOriginalIndex" name="itemOriginalIndex">
            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="itemName">Name</label>
                <input type="text" id="itemName" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            </div>
            
            <div class="pt-4 flex gap-4">
                <button type="button" class="close-modal flex-1 py-3 px-4 bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 rounded-xl font-semibold hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors">Cancel</button>
                <button type="submit" class="flex-1 py-3 px-4 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="notifications.js"></script>
<script src="settings.js"></script>

<script>
  // Sidebar Collapse Logic
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggle-btn');
  const chevron = document.getElementById('chevron');
  const texts = document.querySelectorAll('.sidebar-text');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('w-80');
    sidebar.classList.toggle('w-28');
    chevron.classList.toggle('rotate-180');
    texts.forEach(text => text.classList.toggle('hidden'));
  });
</script>
</body>
</html>
