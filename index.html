<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    .TICKET-BG {
      background-image: linear-gradient(to bottom right, rgba(59, 130, 246, 0.3), rgba(30, 58, 138, 0.4)), url('TICKET-BG.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
  <link rel="stylesheet" href="notifications.css">
</head>
<body class="TICKET-BG bg-gray-100 dark:bg-gray-900 transition-colors duration-300 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg p-8 rounded-3xl shadow-2xl w-full max-w-4xl border border-white/20 dark:border-slate-700/50">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white tracking-tight">Submit a Support Ticket</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-1">Please provide details about your issue below.</p>
      </div>
    </div>

    <form id="ticketForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
        
        <!-- Subject -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="subject">Subject</label>
          <select id="subject" name="subject" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            <option value="" disabled selected>Select Ticket Subject</option>
            <option value="Hardware Repair/Issue">Hardware Repair/Issue</option>
            <option value="Software Installation/Issue">Software Installation/Issue</option>
            <option value="Network/Wi-Fi Connectivity">Network/Wi-Fi Connectivity</option>
            <option value="Account/Password Access">Account/Password Access</option>
            <option value="Email Configuration/Issue">Email Configuration/Issue</option>
            <option value="Printer/Peripheral Issue">Printer/Peripheral Issue</option>
            <option value="System Access Request">System Access Request</option>
            <option value="General Inquiry/Others">General Inquiry/Others</option>
          </select>
          <input type="text" id="subjectOther" name="subjectOther" class="hidden mt-2 w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="Please specify subject">
        </div>

        <!-- Requester Name -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="requesterName">Requester Name</label>
          <input type="text" id="requesterName" name="requesterName" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="John Doe">
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="email">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="john@example.com">
        </div>

        <!-- Department -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="department">Department</label>
          <select id="department" name="department" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            <option value="" disabled selected>Select Department</option>
            <option value="IT">IT</option>
            <option value="HR">Human Resources (Hr)</option>
            <option value="Finance">Finance</option>
            <option value="Operations">Operations</option>
            <option value="Sales">Sales</option>
            <option value="Others">Others</option>
          </select>
          <input type="text" id="departmentOther" name="departmentOther" class="hidden mt-2 w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="Please specify department">
        </div>

        <!-- Priority -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="priority">Priority</label>
          <select id="priority" name="priority" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            <option value="" disabled selected>Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>

        <!-- Category -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="category">Category</label>
          <select id="category" name="category" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            <option value="" disabled selected>Select Category</option>
            <!-- Options dynamically loaded from JS -->
          </select>
          <input type="text" id="categoryOther" name="categoryOther" class="hidden mt-2 w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="Please specify category">
        </div>

        <!-- Ticket Type -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="ticketType">Ticket Type</label>
          <select id="ticketType" name="ticketType" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
            <option value="" disabled selected>Select Ticket Type</option>
            <!-- Options dynamically loaded from JS -->
          </select>
          <input type="text" id="ticketTypeOther" name="ticketTypeOther" class="hidden mt-2 w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="Please specify ticket type">
        </div>

        <!-- Description -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="description">Description</label>
          <textarea id="description" name="description" rows="2" maxlength="500" required class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200" placeholder="Detailed description of the issue..."></textarea>
          <div class="text-right text-xs text-gray-500 dark:text-gray-400 mt-1">
            <span id="char-count">0</span> / 500
          </div>
        </div>

      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-4 mt-2">
        <button type="submit" id="submitBtn" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5 transition-all duration-200 font-semibold tracking-wide w-full md:w-auto">Create Ticket</button>
      </div>
    </form>
  </div>

  <!-- Admin Modal (Styled with Tailwind) -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 dark:border-slate-700/50 relative">
      <span class="close absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer text-2xl font-bold">&times;</span>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Admin Access</h2>
      <p class="text-gray-500 dark:text-gray-400 mb-6">Enter secure access token:</p>
      
      <div class="mb-6">
        <input type="password" id="adminKey" placeholder="Paste token here" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-600 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 dark:text-white outline-none transition-all duration-200">
      </div>
      
      <button id="adminLoginBtn" class="w-full px-8 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 transition-all duration-200 font-semibold tracking-wide">Access Panel</button>
    </div>
  </div>

  <script src="notifications.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const descriptionInput = document.getElementById('description');
      const charCount = document.getElementById('char-count');
      const ticketForm = document.getElementById('ticketForm');

      if (descriptionInput && charCount) {
        descriptionInput.addEventListener('input', () => {
          charCount.textContent = descriptionInput.value.length;
        });
      }

      // Reset character count when form is reset (handled in script.js but we can add a listener here too)
      ticketForm.addEventListener('reset', () => {
        if (charCount) charCount.textContent = 0;
      });
    });
  </script>
</body>
</html>
